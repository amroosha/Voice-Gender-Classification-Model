[project]
name = "voice-gender-classification-model"
version = "0.1.0"
description = "Production microservice for voice gender classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=5.0.1",
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "joblib>=1.5.2",
  "matplotlib>=3.10.6",
  "mlflow>=3.3.2",
  "numpy>=2.3.2",
  "python-multipart>=0.0.20",
  "scikit-learn>=1.7.1",
  "soundfile>=0.14.0",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "tqdm>=4.66.0",
  "transformers>=4.56.0",
  "uvicorn>=0.35.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]




[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "datasets>=5.0.1",
  "pytest>=8.4.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
